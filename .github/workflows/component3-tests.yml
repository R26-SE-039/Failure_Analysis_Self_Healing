name: Component 3 - Unit and Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'repair-agent/**'
      - 'research/**'
      - '.github/workflows/component3-tests.yml'
  push:
    paths:
      - 'backend/**'
      - 'repair-agent/**'
      - 'research/**'
      - '.github/workflows/component3-tests.yml'

permissions:
  contents: read

jobs:
  component-3-unit-tests:
    name: Component 3 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            repair-agent/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Backend Unit Tests
        working-directory: backend
        env:
          DATABASE_MODE: local
        run: |
          python -m unittest -v \
            tests.test_classifier_regression \
            tests.test_healing_orchestrator \
            tests.test_repair_eligibility \
            tests.test_github_actions_service \
            tests.test_repair_publish_service \
            tests.test_repair_agent_client \
            tests.test_project_configuration_client \
            tests.test_secret_redaction

      - name: Install Repair-Agent Dependencies
        working-directory: repair-agent
        run: |
          python -m pip install -r requirements.txt

      - name: Run Repair-Agent Unit Tests
        working-directory: repair-agent
        run: |
          python -m unittest -v \
            tests.test_planner \
            tests.test_publisher \
            tests.test_mcp_broker \
            tests.test_openrouter_client \
            tests.test_config \
            tests.test_security \
            tests.test_github_remote

  component-3-integration-tests:
    name: Component 3 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            repair-agent/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Backend Integration Tests
        working-directory: backend
        env:
          DATABASE_MODE: local
        run: |
          python -m unittest -v \
            tests.test_analysis_repair_integration \
            tests.test_project_scoping \
            tests.test_repairs_router \
            tests.test_repair_publish_integration \
            tests.test_github_actions_discovery

      - name: Install Repair-Agent Dependencies
        working-directory: repair-agent
        run: |
          python -m pip install -r requirements.txt

      - name: Run Repair-Agent Integration Tests
        working-directory: repair-agent
        run: |
          python -m unittest -v \
            tests.test_api \
            tests.test_publish_broker \
            tests.test_backend_contract