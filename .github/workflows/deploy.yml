name: deploy
# Auto-deploy to the NextGenQA EC2 box on push to the deploy branch.
# Runs on the self-hosted runner ON the box (no inbound SSH). The code is
# fetched via actions/checkout using the ephemeral GITHUB_TOKEN — so NO
# personal access token needs to live on the box, and revoking any PAT can't
# break this. rsync copies the checked-out code into the deployed folder
# (preserving the gitignored .env files + the tracked research/models joblib),
# then rebuilds BOTH services this repo backs (failure + repair-agent).
on:
  push:
    branches: [feature/aws-deploy]
  workflow_dispatch:

concurrency:
  group: deploy-failure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, nextgenqa]
    steps:
      - name: Check out the pushed code
        uses: actions/checkout@v4
        with:
          ref: feature/aws-deploy

      - name: Sync code into the deploy folder
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.env' --exclude='backend/.env' --exclude='repair-agent/.env' ./ ~/Failure_Analysis_Self_Healing/

      - name: Rebuild & restart the services
        run: |
          set -euo pipefail
          cd ~/deploy
          docker compose -f docker-compose.prod.yml --env-file .env up -d --build failure repair-agent

      - name: Prune dangling images
        run: docker image prune -f
